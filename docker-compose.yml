version: '3.8'

services:
  # Backend сервис (Django)
  backend:
    build: .
    container_name: department_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./db.sqlite3:/app/db.sqlite3
    environment:
      - DEBUG=1
    command: python manage.py runserver 0.0.0.0:8000

  # Frontend сервис (React + Nginx)
  frontend:
    build: ./frontend
    container_name: department_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend